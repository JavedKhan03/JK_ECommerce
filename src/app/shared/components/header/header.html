<div class="fixed top-0 left-0 z-50 w-full min-h-[5rem] shadow-[2px_2px_20px_gray] bg-gray-900 flex items-center px-4 gap-4">
    <!-- Logo -->
    <div class="flex items-center shrink-0">
      <h1 class="text-3xl font-bold text-white">
        <a routerLink="/home/products" class="cursor-pointer">JK-Store</a>
      </h1>
    </div>
    <!-- SearchBox -->
    <div class="flex-1 min-w-0 flex items-center justify-center ">
      <app-search-box class="w-full max-w-lg bg-white"></app-search-box>
    </div>
    <!-- Cart/Login/Signup -->
    <div class="flex items-center gap-3 shrink-0">
      <a routerLink="/cart" class="flex items-center gap-1 text-white hover:text-yellow-400 transition">
        <span class="material-icons text-2xl"><fa-icon [icon]="faShoppingCart" class="text-[1.3em]"></fa-icon></span>
        <!-- <span class="text-sm font-semibold">(0)</span> -->
      </a>
      <a routerLink="/login" class="px-3 py-1 rounded bg-yellow-400 text-gray-900 font-semibold hover:bg-yellow-300 transition">Login</a>
      <a routerLink="/signup" class="px-3 py-1 rounded border border-yellow-400 font-semibold hover:bg-yellow-400 hover:text-gray-900 transition">Sign Up</a>
    </div>
  </div>
